[package]
name = "palantir"
version = "0.3.0"
edition = "2024"
authors = ["xxorza <xxorza@gmail.com>"]
description = "An immediate-mode GUI library with WPF-style two-pass layout and a wgpu renderer"
repository = "https://github.com/xorza/palantir"
homepage = "https://github.com/xorza/palantir"
documentation = "https://docs.rs/palantir"
readme = "README.md"
keywords = ["gui", "ui", "immediate-mode", "wgpu", "graphics"]
categories = ["gui", "graphics", "rendering::engine"]
# The bundled Inter / JetBrains Mono faces in `assets/fonts` ship under the
# SIL Open Font License, so the tarball as a whole carries both terms.
license = "(MIT OR Apache-2.0) AND OFL-1.1"
exclude = [
    ".github/",
    ".notes/",
    ".tmp/",
    ".zed/",
    "AGENTS.md",
    "CLAUDE.md",
    "docs/",
    "scripts/",
]

# `internals` exposes test-only reach-ins and `bench` the criterion
# drivers on top; neither is part of the supported surface, so document the
# default features — exactly what a consumer gets.
[package.metadata.docs.rs]
all-features = false

[lints.rust]
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[lints.clippy]
items_after_test_module = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"

[[bin]]
name = "showcase"
path = "src/bin/showcase/main.rs"
required-features = ["showcase"]

[dependencies]
palantir-anim-derive = { path = "anim-derive", version = "0.3" }
arboard = { version = "3.6", default-features = false, optional = true }
bitflags = "2.13"
bytemuck = { version = "1.25", features = ["derive"] }
cosmic-text = "0.19"
fixedbitset = "0.5"
glam = { version = "0.33", default-features = false, features = ["std", "i32", "u16", "u32", "bytemuck", "serde"] }
etagere = "0.3"
resvg = { version = "0.48", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
rayon = { version = "1.12", optional = true }
half = { version = "2.7", features = ["bytemuck"] }
memchr = "2.8"
rustc-hash = "2.1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
pollster = "1.0"
wgpu = { version = "30.0", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal", "dx12"] }
winit = { version = "0.30", optional = true }
padding-struct = "0.2"
soa-rs = "1.0"
strum = { version = "0.28", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
tinyvec = { version = "1.12", features = ["serde"] }
unicode-linebreak = "0.1"
unicode-segmentation = "1.13"

criterion = { version = "0.8", optional = true }
clap = { version = "4", optional = true, features = ["derive"] }
gethostname = { version = "1.1", optional = true }
tracy-client = { version = "0.19", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
backtrace = "0.3"
static_assertions = "1.1"
ron = "0.12"

[[test]]
name = "visual"
path = "tests/visual/main.rs"
required-features = ["internals", "golden"]

[[test]]
name = "alloc"
path = "tests/alloc/main.rs"
required-features = ["internals"]

[[example]]
name = "counter"
required-features = ["winit"]

[[example]]
name = "custom_widget"
required-features = ["winit"]

[[example]]
name = "dump_theme"

[[bench]]
name = "criterion"
harness = false
required-features = ["bench"]

[features]
default = ["winit"]
# Test reach-ins into crate privates — `UiHarness`, the probe counters, the
# headless GPU lease. Deliberately cheap: both integration suites need it to
# reach past the published surface, and neither should pay to compile a
# benchmark harness for the privilege.
internals = []
# The golden-image suite: `image` to read and write PNGs, `rayon` to diff them
# a row at a time. Kept off `internals`, which is deliberately dependency-free
# — a crate reaching past the published surface should not have to build an
# image codec to do it.
golden = ["dep:image", "dep:rayon"]
# Compiles the source-level benchmark drivers and exposes their function-only
# facade to the thin external targets. Implies `internals` — the drivers reach
# into the same privates the tests do, and add the harness crates on top.
bench = ["internals", "dep:criterion", "dep:clap", "dep:gethostname"]
# Enables the bundled widget-tour binary and its logging setup. Carries
# `gpu-debug-markers` because the showcase is what you capture.
showcase = ["dep:tracing-subscriber", "winit", "gpu-debug-markers"]
# GPU debug groups (RenderDoc / Xcode capture labels) around every draw
# step. Off by default: wgpu-core records two commands plus a label
# memcpy per pair even with no capture tool attached, and the step count
# scales with UI complexity. Turn on when you intend to capture.
gpu-debug-markers = []
# The winit-backed host: real windows, a real event loop, and the OS
# clipboard behind `TextEdit`'s cut/copy/paste. One flag rather than two
# because the clipboard only ever had a system backend to reach for when
# a windowed host was already in the build.
winit = ["dep:winit", "dep:arboard"]
profile-with-tracy = ["dep:tracy-client"]


[profile.dev]
debug = "line-tables-only"

[profile.bench]
debug = "line-tables-only"
opt-level = 3
strip = "none"
split-debuginfo = "off"
lto = "fat"
codegen-units = 1

[profile.release]
debug = "line-tables-only"
opt-level = 3
strip = "none"
split-debuginfo = "off"

[profile.release-max]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

# Optimize dependencies even in dev/test builds — the renderer, shaper,
# and math crates are unusable at opt-level 0. `"*"` is every package
# that isn't a workspace member, so palantir's own code keeps its debug
# build; naming the heavy crates individually instead meant each new
# transitive dep silently missed the setting until someone noticed.
[profile.dev.package."*"]
opt-level = 3
