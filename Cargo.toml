[package]
name = "palantir"
version = "0.7.2"
edition = "2024"
authors = ["xxorza <xxorza@gmail.com>"]
description = "An immediate-mode GUI library with WPF-style two-pass layout and a wgpu renderer"
repository = "https://github.com/xorza/palantir"
documentation = "https://docs.rs/palantir"
readme = "README.md"
keywords = ["gui", "ui", "immediate-mode", "wgpu", "graphics"]
categories = ["gui", "graphics", "rendering::engine"]
# The bundled fonts in `assets/fonts` are OFL.
license = "(MIT OR Apache-2.0) AND OFL-1.1"
exclude = [
    ".cargo/",
    ".github/",
    ".gitignore",
    ".notes/",
    ".tmp/",
    ".zed/",
    "AGENTS.md",
    "CLAUDE.md",
    "assets/fonts/test/",
    "assets/logo/",
    "benches/bench-perf.sh",
    "docs/",
    "scripts/",
]


[package.metadata.docs.rs]
all-features = false

[workspace]
members = ["palantir-anim-derive"]


[dependencies]
palantir-anim-derive = { path = "palantir-anim-derive", version = "=0.7.2" }
arboard = { version = "3.6", default-features = false, optional = true }
bytemuck = { version = "1.25", features = ["derive"] }
cosmic-text = "0.19"
fixedbitset = "0.5"
glam = { version = "0.34", default-features = false, features = ["std", "i16", "i32", "u16", "u32", "bytemuck", "serde"] }
etagere = "0.3"
resvg = { version = "0.48", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
half = { version = "2.7", features = ["bytemuck"] }
rustc-hash = "2.1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
pollster = "1.0"
wgpu = { version = "30.0", default-features = false, features = [
    "std",
    "parking_lot",
    "wgsl",
    "vulkan",
    "metal",
    "dx12",
    "gles",
] }
winit = { version = "0.30", optional = true }
padding-struct = "0.2"
soa-rs = "1.0"
strum = { version = "0.28", features = ["derive"] }
swash = "0.2"
serde = { version = "1.0", features = ["derive"] }
tinyvec = { version = "1.13", features = ["serde"] }
unicode-linebreak = "0.1"
unicode-segmentation = "1.13"

criterion = { version = "0.8", optional = true }
clap = { version = "4", optional = true, features = ["derive"] }
gethostname = { version = "1.1", optional = true }
tracy-client = { version = "0.19", optional = true }

# The self dependency turns `internals` on for every example and test, which
# cannot enable a feature of their own package; packaging strips it.
# `default-features = false` keeps `--no-default-features` builds winit-free.
[dev-dependencies]
palantir = { path = ".", default-features = false, features = ["internals"] }
backtrace = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
static_assertions = "1.1"
ron = "0.12"


[features]
default = ["winit"]
internals = []
golden = ["dep:image"]
bench = ["internals", "dep:criterion", "dep:clap", "dep:gethostname"]
gpu-debug-markers = []
system-clipboard = ["dep:arboard"]
winit = ["dep:winit", "system-clipboard"]
profile-with-tracy = ["dep:tracy-client"]


[profile.dev]
opt-level = 1
debug = "full"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

# `objc2` debug assertions allocate on every Metal message send.
[profile.dev.package.objc2]
debug-assertions = false

[profile.release-dev]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = "line-tables-only"
split-debuginfo = "unpacked"
strip = "none"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "debuginfo"

# `benches/bench-perf.sh` sets these three as `CARGO_PROFILE_BENCH_*` too,
# with the same values, so it and `cargo bench` build one binary and neither
# rebuilds after the other. Change them in both places.
[profile.bench]
debug = "line-tables-only"
split-debuginfo = "off"
strip = "none"


[[test]]
name = "visual"
path = "tests/visual/main.rs"
required-features = ["golden"]

[[test]]
name = "alloc"
path = "tests/alloc/main.rs"

[[example]]
name = "counter"
required-features = ["winit"]

[[example]]
name = "showcase"
path = "examples/showcase/main.rs"
required-features = ["winit"]

[[bench]]
name = "criterion"
harness = false
required-features = ["bench"]


# The Darkroom workspace lint set, copied because a submodule does not inherit it. Warn, not
# deny: the verification chain runs clippy with `-D warnings`.
[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Documentation is reviewed, not linted, for these.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# `assert!(x.is_empty())` reads plainer than a comparison with an empty array.
assert_is_empty = "allow"
# `usize -> f32/f64` loses precision only past 2^24.
cast_precision_loss = "allow"
# `f64 -> f32` narrowing is the design of the f32 pipelines.
cast_possible_truncation = "allow"
# Math code names things `x`, `y`, `dx`, `dy`, `cx`.
similar_names = "allow"
many_single_char_names = "allow"
# Size is a review question, not a lint.
too_many_lines = "allow"
# `#[inline(always)]` on `#[target_feature]` SIMD helpers is deliberate.
inline_always = "allow"
# Exact comparison is deliberate: sample-domain scales, sentinels, tests of exact values.
float_cmp = "allow"
# Every pointer cast feeds an unaligned load (`_mm_loadu_*`).
cast_ptr_alignment = "allow"
# `cast_possible_truncation`, allowed above, already admits the wider `usize -> i32`.
cast_possible_wrap = "allow"
# Every proper noun was one more exception to list.
doc_markdown = "allow"
# Digit grouping is style only, and it hides the `RRGGBB` pattern of a hex colour.
unreadable_literal = "allow"
# State and config structs carry independent flags.
struct_excessive_bools = "allow"
# The gated `internals` and `tests` modules open with `use super::*`.
wildcard_imports = "allow"
# The subtraction already panics on underflow, as `checked_sub(..).unwrap()` would.
unchecked_time_subtraction = "allow"
# A shared suffix is usually a unit (`_ns`), and `Window::window` is often the plainest name.
struct_field_names = "allow"
# Equal arms stay apart for a guard, a fallback, or bindings no `|` pattern can join.
match_same_arms = "allow"
# A method is the house home for what works on a type, even when it reads no field.
unused_self = "allow"
absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assigning_clones = "warn"
cast_lossless = "warn"
cast_sign_loss = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
decimal_bitwise_operands = "warn"
default_trait_access = "warn"
ignore_without_reason = "warn"
imprecise_flops = "warn"
items_after_statements = "warn"
items_after_test_module = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
lossy_float_literal = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_wildcard_for_single_variants = "warn"
missing_const_for_fn = "warn"
missing_fields_in_debug = "warn"
needless_pass_by_value = "warn"
print_stderr = "warn"
print_stdout = "warn"
redundant_closure_for_method_calls = "warn"
return_self_not_must_use = "warn"
self_named_module_files = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
trivially_copy_pass_by_ref = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_wraps = "warn"
used_underscore_binding = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"
