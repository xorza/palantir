[package]
name = "palantir"
version = "0.8.3"
edition = "2024"
authors = ["xxorza <xxorza@gmail.com>"]
description = "An immediate-mode GUI library with WPF-style two-pass layout and a wgpu renderer"
repository = "https://github.com/xorza/palantir"
documentation = "https://docs.rs/palantir"
readme = "README.md"
keywords = ["gui", "ui", "immediate-mode", "wgpu", "graphics"]
categories = ["gui", "graphics", "rendering::engine"]
# The bundled fonts in `assets/fonts` are OFL.
license = "(MIT OR Apache-2.0) AND OFL-1.1"
exclude = [
    ".cargo/",
    ".github/",
    ".gitignore",
    ".notes/",
    ".tmp/",
    ".zed/",
    "AGENTS.md",
    "CLAUDE.md",
    "assets/fonts/test/",
    "assets/logo/",
    "benches/bench-perf.sh",
    "docs/",
]


[package.metadata.docs.rs]
all-features = false

# `--all-features` is clippy's alone: under `profile-with-tracy` a test binary opens the Tracy
# socket. The first test set names `alloc`, as `--tests` with `golden` would pull in `visual`,
# whose goldens are local, and the showcase, whose shot mode has tests; the second builds the
# crate without `winit`, as a host embeds it.
# `cargo test` ran the first in 2.1 s where nextest took 4.9 s, as a GPU test under nextest opens
# a device in a process of its own.
[workspace.metadata.drive]
version = "0.2.6"
# The second set lints the build without winit, as the second test lane builds it: CI builds that
# lane under `-D warnings`, so a warning only it shows would fail CI and nothing here.
lint = ["--all-features", "--no-default-features"]
test = [
    "--lib --test alloc --example showcase --features golden,gpu-debug-markers",
    "--lib --no-default-features",
]
test-runner = "cargo-test"
docs = true

# The golden suite, run after a rendering change: in the first test lane's shape so it reuses that
# build. It joins no lane, as its goldens are local to each machine's adapter.
[workspace.metadata.drive.commands.visual]
steps = [{ cargo = "test --workspace --locked --features golden,gpu-debug-markers --test visual", args = true }]

# The showcase played from a script with no desktop: `cargo drive run shot SCRIPT [--out DIR]
# [--against DIR]` writes the script's shots as PNGs and prints a report of each, comparing each
# with an earlier run's through `golden`.
[workspace.metadata.drive.commands.shot]
# The driver puts `--` before a cargo step's arguments, so the binary runs as a program step.
steps = [
    { build = "build --example showcase --features golden" },
    { program = ["{target}/debug/examples/showcase{exe}", "--shot"], args = true },
]

[workspace]
members = ["palantir-anim-derive"]

[lints]
workspace = true


[dependencies]
palantir-anim-derive = { path = "palantir-anim-derive", version = "=0.8.3", default-features = false }
arboard = { version = "3.7", default-features = false, features = ["image-data"], optional = true }
bytemuck = { version = "1.25", default-features = false, features = ["derive"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash", "fontconfig"] }
fixedbitset = { version = "0.5", default-features = false }
foldhash = { version = "0.2", default-features = false, features = ["std"] }
glam = { version = "0.34", default-features = false, features = ["std", "i16", "i32", "u16", "u32", "bytemuck", "serde"] }
resvg = { version = "0.49", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
half = { version = "2.7", default-features = false, features = ["std", "bytemuck"] }
rustc-hash = { version = "2.1", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
pollster = { version = "1.0", default-features = false }
wgpu = { version = "30.0", default-features = false, features = [
    "std",
    "parking_lot",
    "wgsl",
    "vulkan",
    "metal",
    "dx12",
    "gles",
] }
winit = { version = "0.30", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita",
], optional = true }
padding-struct = { version = "0.2", default-features = false }
soa-rs = { version = "1.0", default-features = false }
strum = { version = "0.28", default-features = false, features = ["derive"] }
swash = { version = "0.2", default-features = false, features = ["std", "scale", "render"] }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
tinyvec = { version = "1.13", default-features = false, features = ["serde"] }
unicode-linebreak = { version = "0.1", default-features = false }
unicode-segmentation = { version = "1.13", default-features = false }
criterion = { version = "0.8", default-features = false, optional = true }
tracy-client = { version = "0.19", default-features = false, features = ["enable"], optional = true }

mundy = { version = "0.2", default-features = false, features = [
    "async-io",
    "callback",
    "color-scheme",
    "double-click-interval",
], optional = true }

[dev-dependencies]
palantir = { path = ".", default-features = false, features = ["internals"] }
backtrace = { version = "0.3", default-features = false, features = ["std"] }
# The showcase's shot mode writes PNGs.
image = { version = "0.25", default-features = false, features = ["png"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "std",
    "fmt",
    "env-filter",
    "tracing-log",
] }
static_assertions = { version = "1.1", default-features = false }
ron = { version = "0.12", default-features = false }
naga = { version = "30.0", default-features = false, features = ["wgsl-in"] }


[features]
default = ["winit"]
internals = ["dep:criterion", "dep:image"]
golden = ["dep:image"]
gpu-debug-markers = []
system-clipboard = ["dep:arboard"]
winit = ["dep:winit", "system-clipboard", "dep:mundy"]
profile-with-tracy = ["dep:tracy-client"]



# 1, not the usual 0: the owner's choice, kept on the 2026-10 review.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# `objc2` debug assertions allocate on every Metal message send.
[profile.dev.package.objc2]
debug-assertions = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "full"
split-debuginfo = "off"

[profile.bench]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
debug = "line-tables-only"

[[test]]
name = "visual"
path = "tests/visual/main.rs"
required-features = ["golden"]

[[test]]
name = "alloc"
path = "tests/alloc/main.rs"

[[example]]
name = "counter"
required-features = ["winit"]

[[example]]
name = "showcase"
path = "examples/showcase/main.rs"
required-features = ["winit"]
# The shot mode's tests run with the first test lane.
test = true

[lib]
bench = false

[[bench]]
name = "palantir"
harness = false
required-features = ["internals"]

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
meta_variable_misuse = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
assert_is_empty = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
inline_always = "allow"
float_cmp = "allow"
cast_possible_wrap = "allow"
doc_markdown = "allow"
unreadable_literal = "allow"
struct_excessive_bools = "allow"
wildcard_imports = "allow"
unchecked_time_subtraction = "allow"
struct_field_names = "allow"
match_same_arms = "allow"
unused_self = "allow"
absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_underscore = "warn"
branches_sharing_code = "warn"
clear_with_drain = "warn"
clone_on_ref_ptr = "warn"
collection_is_never_read = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
deref_by_slicing = "warn"
derive_partial_eq_without_eq = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
equatable_if_let = "warn"
exit = "warn"
filetype_is_file = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
imprecise_flops = "warn"
infinite_loop = "warn"
iter_over_hash_type = "warn"
iter_with_drain = "warn"
large_include_file = "warn"
literal_string_with_formatting_args = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
missing_const_for_fn = "warn"
mixed_read_write_in_expression = "warn"
module_name_repetitions = "warn"
mutex_atomic = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
needless_raw_strings = "warn"
negative_feature_names = "warn"
non_zero_suggestions = "warn"
or_fun_call = "warn"
pathbuf_init_then_push = "warn"
precedence_bits = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
redundant_feature_names = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
self_named_module_files = "warn"
string_lit_chars_any = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
try_err = "warn"
type_repetition_in_bounds = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
verbose_file_reads = "warn"
wildcard_dependencies = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"
