[package]
name = "palantir"
version = "0.4.0"
edition = "2024"
authors = ["xxorza <xxorza@gmail.com>"]
description = "An immediate-mode GUI library with WPF-style two-pass layout and a wgpu renderer"
repository = "https://github.com/xorza/palantir"
homepage = "https://github.com/xorza/palantir"
documentation = "https://docs.rs/palantir"
readme = "README.md"
keywords = ["gui", "ui", "immediate-mode", "wgpu", "graphics"]
categories = ["gui", "graphics", "rendering::engine"]
# The bundled Inter / JetBrains Mono faces in `assets/fonts` ship under the
# SIL Open Font License, so the tarball as a whole carries both terms.
license = "(MIT OR Apache-2.0) AND OFL-1.1"
exclude = [
    ".github/",
    ".gitignore",
    ".notes/",
    ".tmp/",
    ".zed/",
    "AGENTS.md",
    "CLAUDE.md",
    "assets/logo/",
    "docs/",
    "scripts/",
]

# `internals` exposes test-only reach-ins and `bench` the criterion
# drivers on top; neither is part of the supported surface, so document the
# default features — exactly what a consumer gets.
[package.metadata.docs.rs]
all-features = false

[workspace]
members = ["anim-derive"]

[lints.rust]
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[lints.clippy]
clone_on_ref_ptr = "deny"
items_after_test_module = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"

[dependencies]
palantir-anim-derive = { path = "anim-derive", version = "=0.4.0" }
arboard = { version = "3.6", default-features = false, optional = true }
bitflags = "2.13"
bytemuck = { version = "1.25", features = ["derive"] }
cosmic-text = "0.19"
fixedbitset = "0.5"
glam = { version = "0.33", default-features = false, features = ["std", "i16", "i32", "u16", "u32", "bytemuck", "serde"] }
etagere = "0.3"
resvg = { version = "0.48", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
rayon = { version = "1.12", optional = true }
half = { version = "2.7", features = ["bytemuck"] }
memchr = "2.8"
rustc-hash = "2.1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
pollster = "1.0"
wgpu = { version = "30.0", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal", "dx12"] }
winit = { version = "0.30", optional = true }
padding-struct = "0.2"
soa-rs = "1.0"
strum = { version = "0.28", features = ["derive"] }
swash = "0.2"
serde = { version = "1.0", features = ["derive"] }
tinyvec = { version = "1.13", features = ["serde"] }
unicode-linebreak = "0.1"
unicode-segmentation = "1.13"

criterion = { version = "0.8", optional = true }
clap = { version = "4", optional = true, features = ["derive"] }
gethostname = { version = "1.1", optional = true }
tracy-client = { version = "0.19", optional = true }

[dev-dependencies]
backtrace = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
static_assertions = "1.1"
ron = "0.12"

[[test]]
name = "visual"
path = "tests/visual/main.rs"
required-features = ["internals", "golden"]

[[test]]
name = "alloc"
path = "tests/alloc/main.rs"
required-features = ["internals"]

[[example]]
name = "counter"
required-features = ["winit"]

[[example]]
name = "showcase"
path = "examples/showcase/main.rs"
required-features = ["winit", "showcase"]

[[example]]
name = "custom_widget"
required-features = ["winit"]

[[example]]
name = "dump_theme"

[[bench]]
name = "criterion"
harness = false
required-features = ["bench"]

[features]
default = ["winit"]
internals = []
golden = ["dep:image", "dep:rayon"]
bench = ["internals", "dep:criterion", "dep:clap", "dep:gethostname"]
# Exposes the two demo surfaces the bundled `showcase` example reads —
# `demo_swatches` and `FrameFixture`. Nothing else: the example names `winit`
# in its own `required-features`, and an example cannot turn on the gate it
# needs, which is the whole reason this flag exists.
showcase = []
gpu-debug-markers = []
system-clipboard = ["dep:arboard"]
winit = ["dep:winit", "system-clipboard"]
profile-with-tracy = ["dep:tracy-client"]


[profile.dev]
debug = "line-tables-only"

[profile.bench]
debug = "line-tables-only"
opt-level = 3
strip = "none"
split-debuginfo = "off"
lto = "fat"
codegen-units = 1

[profile.release]
debug = "line-tables-only"
opt-level = 3
strip = "none"
split-debuginfo = "off"

[profile.release-max]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

# Optimize dependencies even in dev/test builds — the renderer, shaper,
# and math crates are unusable at opt-level 0. `"*"` is every package
# that isn't a workspace member, so palantir's own code keeps its debug
# build; naming the heavy crates individually instead meant each new
# transitive dep silently missed the setting until someone noticed.
[profile.dev.package."*"]
opt-level = 3
