[package]
name = "palantir"
version = "0.3.0"
edition = "2024"
authors = ["xxorza <xxorza@gmail.com>"]
description = "An immediate-mode GUI library with WPF-style two-pass layout and a wgpu renderer"
repository = "https://github.com/xorza/palantir"
homepage = "https://github.com/xorza/palantir"
documentation = "https://docs.rs/palantir"
readme = "README.md"
keywords = ["gui", "ui", "immediate-mode", "wgpu", "graphics"]
categories = ["gui", "graphics", "rendering::engine"]
# The bundled Inter / JetBrains Mono faces in `assets/fonts` ship under the
# SIL Open Font License, so the tarball as a whole carries both terms.
license = "GPL-3.0-or-later AND OFL-1.1"
exclude = [
    ".github/",
    ".notes/",
    ".tmp/",
    ".zed/",
    "AGENTS.md",
    "CLA.md",
    "CLAUDE.md",
    "CONTRIBUTING.md",
    "docs/",
    "scripts/",
]

# `internals` pulls in criterion/dhat and exposes test-only reach-ins that
# aren't part of the supported surface, so document the default features —
# exactly what a consumer gets.
[package.metadata.docs.rs]
all-features = false

[lints.rust]
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[lints.clippy]
items_after_test_module = "deny"

[[bin]]
name = "showcase"
path = "src/bin/showcase/main.rs"
required-features = ["showcase"]

[dependencies]
palantir-anim-derive = { path = "anim-derive", version = "0.3" }
arboard = { version = "3.6", default-features = false, optional = true }
bitflags = "2.13"
bytemuck = { version = "1.25", features = ["derive"] }
cosmic-text = "0.19"
fixedbitset = "0.5"
# Window/image extents use i32/u16/u32; Shadow and GPU wires need the integration features.
glam = { version = "0.33", default-features = false, features = ["std", "i32", "u16", "u32", "bytemuck", "serde"] }
etagere = "0.3"
half = { version = "2.7", features = ["bytemuck"] }
memchr = "2.8"
rustc-hash = "2.1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
pollster = { version = "1.0", optional = true }
wgpu = { version = "30.0", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal", "dx12"] }
winit = { version = "0.30", optional = true }
padding-struct = "0.2"
soa-rs = "1.0"
strum = { version = "0.28", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
# Gradient stop arrays are part of the serialized public theme format.
tinyvec = { version = "1.12", features = ["serde"] }
# Same UAX #14 source cosmic-text splits its shape words on, so the
# intrinsic-width scan agrees with the shaper about where a line can break.
unicode-linebreak = "0.1"
unicode-segmentation = "1.13"

criterion = { version = "0.8", optional = true }
dhat = { version = "0.3", optional = true }
gethostname = { version = "1.1", optional = true }
# Pinned to whatever `profiling/profile-with-tracy` resolves to so cargo
# dedupes to one tracy-client instance (one FFI connection). Bump in
# lockstep with `profiling`.
tracy-client = { version = "0.18", default-features = false, optional = true }
profiling = { version = "1.0", default-features = false, features = ["procmacros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
backtrace = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1.12"
static_assertions = "1.1"
toml = "1.1"

[[test]]
name = "visual"
path = "tests/visual/main.rs"
required-features = ["internals"]

[[test]]
name = "alloc"
path = "tests/alloc/main.rs"
required-features = ["internals"]

[[example]]
name = "frame_visual"
required-features = ["internals", "winit-host"]

[[example]]
name = "counter"
required-features = ["winit-host"]

[[example]]
name = "custom_widget"
required-features = ["winit-host"]

[[bench]]
name = "frame"
harness = false
required-features = ["internals"]

[[bench]]
name = "animation"
harness = false
required-features = ["internals"]

[[bench]]
name = "alloc_free"
harness = false
required-features = ["internals"]

[[bench]]
name = "alloc_resize"
harness = false
# Needs `Ui::for_test_text()` (internals-gated) so it shapes with real
# cosmic-text. With the mono fallback the resize path's paint counts
# stay constant, the cascade cache reuses in place, and the bench
# reports a false 0 — see the module docs.
required-features = ["internals"]

[[bench]]
name = "alloc_free_gpu"
harness = false
required-features = ["internals"]

[[bench]]
name = "text_atlas"
harness = false
required-features = ["internals"]

[[bench]]
name = "curve_pipeline"
harness = false
required-features = ["internals"]

[[bench]]
name = "image_pipeline"
harness = false
required-features = ["internals"]

[[bench]]
name = "schedule"
harness = false
required-features = ["internals"]

[[bench]]
name = "record_pass"
harness = false
required-features = ["internals"]

[[bench]]
name = "text_shape"
harness = false
required-features = ["internals"]

[[bench]]
name = "text_edit"
harness = false
required-features = ["internals"]

[[bench]]
name = "input_throughput"
harness = false
required-features = ["internals"]

[[bench]]
name = "caches"
harness = false
required-features = ["internals"]

[[bench]]
name = "damage"
harness = false
required-features = ["internals"]

[[bench]]
name = "composer"
harness = false
required-features = ["internals"]

[[bench]]
name = "text_grid"
harness = false
required-features = ["internals"]

[[bench]]
name = "gradient"
harness = false
required-features = ["internals"]

[[bench]]
name = "paint_anims"
harness = false
required-features = ["internals"]

[[bench]]
name = "cascade"
harness = false
required-features = ["internals"]

[features]
default = ["system-clipboard", "winit-host"]
# Compiles the source-level benchmark drivers and exposes their function-only
# facade to the thin external targets.
internals = ["dep:criterion", "dep:dhat", "dep:gethostname", "dep:pollster"]
# Enables the bundled widget-tour binary and its logging setup. Carries
# `gpu-debug-markers` because the showcase is what you capture.
showcase = ["dep:tracing-subscriber", "winit-host", "gpu-debug-markers"]
# GPU debug groups (RenderDoc / Xcode capture labels) around every draw
# step. Off by default: wgpu-core records two commands plus a label
# memcpy per pair even with no capture tool attached, and the step count
# scales with UI complexity. Turn on when you intend to capture.
gpu-debug-markers = []
system-clipboard = ["winit-host", "dep:arboard"]
winit-host = ["dep:pollster", "dep:winit"]
# Profiler backend — off by default (zero overhead).
# Tracy needs an external viewer; wgpu's own GPU zones light up
# automatically because `profiling` is a singleton in the dep graph.
profile-with-tracy = ["profiling/profile-with-tracy", "dep:tracy-client"]

[profile.bench]
debug = true
opt-level = 3
strip = "none"
split-debuginfo = "off"
lto = "fat"
codegen-units = 1

[profile.release]
debug = true
opt-level = 3
strip = "none"
split-debuginfo = "off"

[profile.release-max]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

# Optimize dependencies even in dev/test builds — the renderer, shaper,
# and math crates are unusable at opt-level 0. `"*"` is every package
# that isn't a workspace member, so palantir's own code keeps its debug
# build; naming the heavy crates individually instead meant each new
# transitive dep silently missed the setting until someone noticed.
[profile.dev.package."*"]
opt-level = 3
