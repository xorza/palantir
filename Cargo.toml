[package]
name = "palantir"
version = "0.7.1"
edition = "2024"
authors = ["xxorza <xxorza@gmail.com>"]
description = "An immediate-mode GUI library with WPF-style two-pass layout and a wgpu renderer"
repository = "https://github.com/xorza/palantir"
homepage = "https://github.com/xorza/palantir"
documentation = "https://docs.rs/palantir"
readme = "README.md"
keywords = ["gui", "ui", "immediate-mode", "wgpu", "graphics"]
categories = ["gui", "graphics", "rendering::engine"]
# The bundled Inter / JetBrains Mono faces in `assets/fonts` ship under the
# SIL Open Font License, so the tarball as a whole carries both terms.
license = "(MIT OR Apache-2.0) AND OFL-1.1"
exclude = [
    ".cargo/",
    ".github/",
    ".gitignore",
    ".notes/",
    ".tmp/",
    ".zed/",
    "AGENTS.md",
    "CLAUDE.md",
    "assets/fonts/test/",
    "assets/logo/",
    "benches/bench-perf.sh",
    "docs/",
]

# `internals` exposes test-only reach-ins and `bench` the criterion
# drivers on top; neither is part of the supported surface, so document the
# default features — exactly what a consumer gets.
[package.metadata.docs.rs]
all-features = false

[workspace]
members = ["palantir-anim-derive"]

# One lint set for every crate of the Darkroom workspace, copied here because a submodule does
# not inherit it. Warn, not deny: the verification chain runs clippy with `-D warnings`, and a
# build in the middle of an edit keeps working. Every suppression in code is
# `#[expect(.., reason = "..")]`.
[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Documentation is reviewed, not linted, for these.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# `assert!(x.is_empty())` reads plainer than a comparison with an empty array.
assert_is_empty = "allow"
# `usize -> f32/f64` in numeric code: a hit says nothing unless the value passes 2^24, and the
# code cannot show that.
cast_precision_loss = "allow"
# `f64 -> f32` narrowing is the design of the f32 pipelines.
cast_possible_truncation = "allow"
# Math code names things `x`, `y`, `dx`, `dy`, `cx`.
similar_names = "allow"
many_single_char_names = "allow"
# Size is a review question, not a lint.
too_many_lines = "allow"
# `#[inline(always)]` on `#[target_feature]` SIMD helpers is deliberate.
inline_always = "allow"
# Exact comparison is deliberate: sample-domain scales, sentinels, tests of exact values.
float_cmp = "allow"
# Every pointer cast feeds an unaligned load (`_mm_loadu_*`).
cast_ptr_alignment = "allow"
# `u32 -> i32` wraps only above 2^31, and `cast_possible_truncation`, allowed above, already
# admits the wider `usize -> i32`.
cast_possible_wrap = "allow"
# Backticks in docs are reviewed, not linted: every proper noun was one more exception to list.
doc_markdown = "allow"
# Digit grouping is style only, and it hides the `RRGGBB` pattern of a hex colour.
unreadable_literal = "allow"
# State and config structs carry independent flags; the enum or bitflags it asks for fits neither.
struct_excessive_bools = "allow"
# The `use super::*` the gated `internals` and `tests` modules open with is the house style.
wildcard_imports = "allow"
# `Instant - Duration` and `Duration - Duration` already panic on underflow; the
# `checked_sub(..).unwrap()` it asks for panics the same way, only longer.
unchecked_time_subtraction = "allow"
# A suffix every field shares is usually a unit or an encoding (`_ns`, `_q`), and a field named
# after its struct (`Window::window`) is often the plainest name it has.
struct_field_names = "allow"
# Arms with equal bodies often stay apart on purpose: a guard, a fallback, or bindings of
# different types that no `|` pattern can join.
match_same_arms = "allow"
# A method is the house home for what works on a type, even when the body reads no field
# (a pipeline's `draw`) or reads one only under `cfg(test)`.
unused_self = "allow"
absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assigning_clones = "warn"
cast_lossless = "warn"
cast_sign_loss = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
decimal_bitwise_operands = "warn"
default_trait_access = "warn"
ignore_without_reason = "warn"
imprecise_flops = "warn"
items_after_statements = "warn"
items_after_test_module = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
lossy_float_literal = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_wildcard_for_single_variants = "warn"
# `const fn` by default: every fn that can be one is.
missing_const_for_fn = "warn"
missing_fields_in_debug = "warn"
needless_pass_by_value = "warn"
print_stderr = "warn"
print_stdout = "warn"
redundant_closure_for_method_calls = "warn"
return_self_not_must_use = "warn"
self_named_module_files = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
trivially_copy_pass_by_ref = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_wraps = "warn"
used_underscore_binding = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"

[dependencies]
palantir-anim-derive = { path = "palantir-anim-derive", version = "=0.7.1" }
arboard = { version = "3.6", default-features = false, optional = true }
bytemuck = { version = "1.25", features = ["derive"] }
cosmic-text = "0.19"
fixedbitset = "0.5"
glam = { version = "0.33", default-features = false, features = ["std", "i16", "i32", "u16", "u32", "bytemuck", "serde"] }
etagere = "0.3"
resvg = { version = "0.48", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
half = { version = "2.7", features = ["bytemuck"] }
rustc-hash = "2.1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
pollster = "1.0"
wgpu = { version = "30.0", default-features = false, features = [
    "std",
    "parking_lot",
    "wgsl",
    "vulkan",
    "metal",
    "dx12",
    "gles",
] }
winit = { version = "0.30", optional = true }
padding-struct = "0.2"
soa-rs = "1.0"
strum = { version = "0.28", features = ["derive"] }
swash = "0.2"
serde = { version = "1.0", features = ["derive"] }
tinyvec = { version = "1.13", features = ["serde"] }
unicode-linebreak = "0.1"
unicode-segmentation = "1.13"

criterion = { version = "0.8", optional = true }
clap = { version = "4", optional = true, features = ["derive"] }
gethostname = { version = "1.1", optional = true }
tracy-client = { version = "0.19", optional = true }

# An example cannot turn on a feature of its own package, and the bundled
# showcase needs `internals` for the two demo surfaces it reads. Depending on
# ourselves is the only way to hand it one. Cargo strips a path-only
# dev-dependency when packaging, so the published manifest carries no cycle.
#
# `default-features = false` is what keeps `--no-default-features` meaningful:
# a request here unifies into every test target, so without it the flag builds
# the default feature set and the winit-free configuration goes uncompiled.
[dev-dependencies]
palantir = { path = ".", default-features = false, features = ["internals"] }
backtrace = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
static_assertions = "1.1"
ron = "0.12"

[[test]]
name = "visual"
path = "tests/visual/main.rs"
required-features = ["internals", "golden"]

[[test]]
name = "alloc"
path = "tests/alloc/main.rs"
required-features = ["internals"]

[[example]]
name = "counter"
required-features = ["winit"]

[[example]]
name = "showcase"
path = "examples/showcase/main.rs"
required-features = ["winit"]

[[bench]]
name = "criterion"
harness = false
required-features = ["bench"]

[features]
default = ["winit"]
internals = []
golden = ["dep:image"]
bench = ["internals", "dep:criterion", "dep:clap", "dep:gethostname"]
gpu-debug-markers = []
system-clipboard = ["dep:arboard"]
winit = ["dep:winit", "system-clipboard"]
profile-with-tracy = ["dep:tracy-client"]


[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"
split-debuginfo = "off"

# Inherits `release`.
[profile.bench]
lto = "fat"
codegen-units = 1

[profile.release-max]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"


[profile.dev.package."*"]
opt-level = 3

# With debug assertions on, `objc2` checks every message send against the
# runtime's method signature, which parses a type encoding and allocates. It
# sits behind every Metal call, so a frame pays it a few hundred times.
[profile.dev.package.objc2]
debug-assertions = false
