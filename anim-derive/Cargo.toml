[package]
name = "palantir-anim-derive"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["xxorza <xxorza@gmail.com>"]
description = "Derive macro for palantir's Animatable trait"
repository = "https://github.com/xorza/palantir"
homepage = "https://github.com/xorza/palantir"
documentation = "https://docs.rs/palantir-anim-derive"
keywords = ["palantir", "gui", "animation", "derive", "macro"]
categories = ["gui", "rust-patterns"]
license = "GPL-3.0-or-later"
exclude = ["AGENTS.md", "CLAUDE.md"]

[lints.rust]
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[lints.clippy]
items_after_test_module = "deny"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", default-features = false, features = [
    "derive",
    "parsing",
    "printing",
    "proc-macro",
] }
