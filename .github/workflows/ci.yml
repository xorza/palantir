name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# master keeps a status per commit. A pull request only needs its latest push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Only master writes, so a pull request cannot evict what others read.
          save-if: ${{ github.ref == 'refs/heads/master' }}
          key: ${{ matrix.os }}
      # Compiles the internals/golden/bench reach-ins and the examples. Clippy
      # never runs them, so the golden suite's absent baselines cost nothing.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Windows is here for Dx12, which runs nowhere else. Compiling it is
        # not enough: a backend can disagree about layout and fail only at
        # runtime. This crate has met that once already — HLSL constant-buffer
        # rules put a nested immediate member on the next register, and text
        # vanished on Dx12 while every other pipeline was fine (see
        # `prelude.wgsl`). Nothing but a test on Windows catches the next one.
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v5
      # Hosted Linux runners have no GPU, and vulkan is the only backend this
      # crate builds there. macOS needs nothing: its runner exposes Metal, and
      # Windows nothing either: WARP, Microsoft's software Dx12 adapter, ships
      # in the box.
      - name: Install a software Vulkan adapter
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers vulkan-tools libvulkan1 libxkbcommon-dev
          vulkaninfo --summary
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          key: ${{ matrix.os }}
      - run: cargo test --locked --lib
      # `winit` off is a supported configuration: the crate then embeds into a
      # host's own event loop. Nothing else in the matrix builds it, and the
      # self dev-dependency has to keep `default-features = false` for this
      # invocation to differ from the one above at all.
      - run: cargo test --locked --lib --no-default-features
      # `alloc` without its two device-driven modules — see `gates/on_gpu.rs`.
      # Its own invocation, so a skip cannot reach a lib test. `visual` needs
      # `golden`, which stays off: its baselines are gitignored.
      #
      # One line because Windows runs a step under PowerShell, where a
      # backslash continuation is not one — it reads the next line's `--` as a
      # unary operator and stops.
      - run: cargo test --locked --test alloc -- --skip fixtures::renderer:: --skip gates::on_gpu::
      # `doc = include_str!` makes the README a doctest, and its example needs
      # the default features.
      - run: cargo test --locked --doc

  docs:
    name: rustdoc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # `package.metadata.docs.rs` sets `all-features = false`.
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
