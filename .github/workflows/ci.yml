name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the latest push to a branch or a pull request needs a status.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Clippy's 75 minutes and the tests' 75, in one job.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Each runs the GPU tests on its OS's backend: compiling one is not enough, as a backend can
        # fail only at run time.
        os: [ubuntu-26.04, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@v7
      # Hosted runners have no GPU. macOS needs nothing: its runner exposes Metal.
      - name: Install a software Vulkan adapter
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers vulkan-tools libvulkan1 libxkbcommon-dev
          vulkaninfo --summary
      # A Windows runner holds no Vulkan loader and no driver: the SDK brings the loader, and Mesa
      # lavapipe, a software adapter, as wgpu's own CI installs them.
      - name: Install a software Vulkan adapter on Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          MESA_VERSION: 26.2.6
          VULKAN_SDK_VERSION: 1.4.357.0
        run: |
          set -e
          curl.exe -L --retry 5 "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$VULKAN_SDK_VERSION.exe" -o vulkan-sdk-installer.exe
          ./vulkan-sdk-installer.exe --accept-licenses --default-answer --confirm-command install
          echo "C:/VulkanSDK/$VULKAN_SDK_VERSION/Bin" >> "$GITHUB_PATH"
          curl.exe -L --retry 5 "https://github.com/pal1000/mesa-dist-win/releases/download/$MESA_VERSION/mesa3d-$MESA_VERSION-release-msvc.7z" -o mesa.7z
          7z.exe e mesa.7z -omesa x64/vulkan_lvp.dll x64/lvp_icd.x86_64.json
          echo "VK_DRIVER_FILES=$(cygpath --windows "$PWD/mesa/lvp_icd.x86_64.json")" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Only master writes, so a pull request cannot evict what others read.
          # No `key`: the action already keys on job, OS and architecture, and
          # nothing else tells the matrix entries apart.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # The gate of AGENTS.md, one step per command, each run past an earlier failure, so one run
      # reports every lane.
      - run: cargo fmt --all --check
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-lint
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-lint-nowinit
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-ship
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-ship-nowinit
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-test
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-test-nowinit
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-doc
        env:
          RUSTDOCFLAGS: -D warnings
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-doctest

  api-surface:
    name: public API surface
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo install --locked --git https://github.com/xorza/drive
      # The committed surface must be what the tree renders: a change to the public API shows
      # here as a diff until `.notes/API_SURFACE.md` is regenerated with it.
      - run: cargo drive surface
      - run: git diff --exit-code -- .notes/API_SURFACE.md
