name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# master keeps a status per commit. A pull request only needs its latest push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Clippy's 75 minutes and the tests' 75, in one job.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Windows is here for Dx12, which runs nowhere else. Compiling it is
        # not enough: a backend can disagree about layout and fail only at
        # runtime. This crate has met that once already — HLSL constant-buffer
        # rules put a nested immediate member on the next register, and text
        # vanished on Dx12 while every other pipeline was fine (see
        # `prelude.wgsl`). Nothing but a test on Windows catches the next one.
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
      # Hosted Linux runners have no GPU, and vulkan is the only backend this
      # crate builds there. macOS needs nothing: its runner exposes Metal, and
      # Windows nothing either: WARP, Microsoft's software Dx12 adapter, ships
      # in the box.
      - name: Install a software Vulkan adapter
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers vulkan-tools libvulkan1 libxkbcommon-dev
          vulkaninfo --summary
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Only master writes, so a pull request cannot evict what others read.
          # No `key`: the action already keys on job, OS and architecture, and
          # nothing else tells the matrix entries apart.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # The driver's master, which the cache's `~/.cargo/bin` keeps until it moves. A master the
      # drive table's `version` does not take fails the gate, and names the version it is.
      - run: cargo install --locked --git https://github.com/xorza/drive
      # `--ci` runs past failures: fmt --check, every target under every lint
      # set, the build that ships, rustdoc, the test lanes and the doc tests,
      # as `Cargo.toml`'s `[workspace.metadata.drive]` states them, with
      # `docs = true`.
      # Clippy never runs the golden suite, so its absent baselines cost
      # nothing, and `profile-with-tracy` starts no profiler. The test lanes are `alloc` beside the library, and
      # the library without `winit`, a supported configuration in which the
      # crate embeds into a host's own event loop; `doc = include_str!` makes
      # the README a doc test.
      - run: cargo drive gate --ci

  api-surface:
    name: public API surface
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # rustdoc JSON is nightly-only; the tool itself builds on stable, which the second step
      # makes the default.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # The committed surface must be what the tree renders: a change to the public API shows
      # here as a diff until `.notes/API_SURFACE.md` is regenerated with it.
      - run: cargo run --locked -p api-surface
      - run: git diff --exit-code -- .notes/API_SURFACE.md
