name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the latest push to a branch or a pull request needs a status.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Clippy's 75 minutes and the tests' 75, in one job.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Windows is here for Dx12, which runs nowhere else. Compiling it is
        # not enough: a backend can disagree about layout and fail only at
        # runtime. This crate has met that once already — HLSL constant-buffer
        # rules put a nested immediate member on the next register, and text
        # vanished on Dx12 while every other pipeline was fine (see
        # `prelude.wgsl`). Nothing but a test on Windows catches the next one.
        os: [ubuntu-26.04, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@v7
      # Hosted Linux runners have no GPU, and vulkan is the only backend this
      # crate builds there. macOS needs nothing: its runner exposes Metal, and
      # Windows nothing either: WARP, Microsoft's software Dx12 adapter, ships
      # in the box.
      - name: Install a software Vulkan adapter
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers vulkan-tools libvulkan1 libxkbcommon-dev
          vulkaninfo --summary
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Only master writes, so a pull request cannot evict what others read.
          # No `key`: the action already keys on job, OS and architecture, and
          # nothing else tells the matrix entries apart.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # The gate of AGENTS.md, one step per command, each run past an earlier failure, so one run
      # reports every lane.
      - run: cargo fmt --all --check
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-lint
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-lint-nowinit
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-ship
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-ship-nowinit
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-test
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-test-nowinit
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-doc
        env:
          RUSTDOCFLAGS: -D warnings
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-doctest

  api-surface:
    name: public API surface
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo install --locked --git https://github.com/xorza/drive
      # The committed surface must be what the tree renders: a change to the public API shows
      # here as a diff until `.notes/API_SURFACE.md` is regenerated with it.
      - run: cargo drive surface
      - run: git diff --exit-code -- .notes/API_SURFACE.md
