name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the latest push to a branch or a pull request needs a status.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The driver's commit that the drive table's `version` takes.
env:
  DRIVE_REV: 271baf137770ad5ff14c3089bf82eee70025fcb6

# `xorza/rust-ci` holds the steps each repository and OS shares. Its actions read bash, and a `run`
# gets `pipefail` only from a named shell.
defaults:
  run:
    shell: bash

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hang in the tests ends at its step's limit.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Each runs the GPU tests on its OS's backend: compiling one is not enough, as a backend can
        # fail only at run time.
        os: [ubuntu-26.04, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: xorza/rust-ci/setup@5c6e2c57d2c89c894225a4fd2ac61e9129e9e32b # v1
        with:
          apt-packages: libxkbcommon-dev
      - uses: xorza/rust-ci/lavapipe@5c6e2c57d2c89c894225a4fd2ac61e9129e9e32b # v1
      - uses: xorza/rust-ci/crash-capture@5c6e2c57d2c89c894225a4fd2ac61e9129e9e32b # v1
      # The gate of AGENTS.md, one step per command, each run past an earlier failure, so one run
      # reports every lane. The build apart from the run, so each shows its own time.
      - run: cargo fmt --all --check
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-lint
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-lint-nowinit
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-ship
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-ship-nowinit
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-test --no-run
      - uses: xorza/rust-ci/test@5c6e2c57d2c89c894225a4fd2ac61e9129e9e32b # v1
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        with:
          command: cargo --locked gate-test
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-test-nowinit --no-run
      - uses: xorza/rust-ci/test@5c6e2c57d2c89c894225a4fd2ac61e9129e9e32b # v1
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        with:
          command: cargo --locked gate-test-nowinit
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-doc
      - uses: xorza/rust-ci/test@5c6e2c57d2c89c894225a4fd2ac61e9129e9e32b # v1
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        with:
          command: cargo --locked gate-doctest
      - uses: xorza/rust-ci/failure-report@5c6e2c57d2c89c894225a4fd2ac61e9129e9e32b # v1
        if: failure()

  api-surface:
    name: public API surface
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: xorza/rust-ci/setup@5c6e2c57d2c89c894225a4fd2ac61e9129e9e32b # v1
      - run: cargo install --locked --git https://github.com/xorza/drive --rev "$DRIVE_REV"
      # The committed surface must be what the tree renders: a change to the public API shows
      # here as a diff until `.notes/API_SURFACE.md` is regenerated with it.
      - run: cargo drive surface
      - run: git diff --exit-code -- .notes/API_SURFACE.md

  workflows:
    name: workflow checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: xorza/rust-ci/workflow-check@5c6e2c57d2c89c894225a4fd2ac61e9129e9e32b # v1
