name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the latest push to a branch or a pull request needs a status.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Clippy's 75 minutes and the tests' 75, in one job.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Each runs the GPU tests on its OS's backend: compiling one is not enough, as a backend can
        # fail only at run time.
        os: [ubuntu-26.04, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@v7
      # Hosted runners have no GPU. macOS needs nothing: its runner exposes Metal.
      - name: Install a software Vulkan adapter
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers vulkan-tools libvulkan1 libxkbcommon-dev
          vulkaninfo --summary
      # A Windows runner holds no Vulkan loader and no driver: LunarG's runtime brings the loader,
      # and Mesa lavapipe, a software adapter, as wgpu's own CI installs it. `vulkaninfo` fails this
      # step if the two do not meet, where the tests would each fail on no adapter.
      - name: Install a software Vulkan adapter on Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          MESA_VERSION: 26.2.6
          VULKAN_RUNTIME_VERSION: 1.4.357.0
        run: |
          set -e
          runtime="VulkanRT-X64-$VULKAN_RUNTIME_VERSION-Components"
          curl.exe -L --retry 5 "https://sdk.lunarg.com/sdk/download/$VULKAN_RUNTIME_VERSION/windows/$runtime.zip" -o vulkan-runtime.zip
          7z.exe e vulkan-runtime.zip -ovulkan "$runtime/x64/vulkan-1.dll" "$runtime/x64/vulkaninfo.exe"
          curl.exe -L --retry 5 "https://github.com/pal1000/mesa-dist-win/releases/download/$MESA_VERSION/mesa3d-$MESA_VERSION-release-msvc.7z" -o mesa.7z
          7z.exe e mesa.7z -ovulkan x64/vulkan_lvp.dll x64/lvp_icd.x86_64.json
          # The registry, as a runner is elevated and the loader ignores `VK_DRIVER_FILES` under that.
          MSYS_NO_PATHCONV=1 reg.exe add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' /v "$(cygpath --windows "$PWD/vulkan/lvp_icd.x86_64.json")" /t REG_DWORD /d 0 /f
          ./vulkan/vulkaninfo.exe --summary
          cygpath --windows "$PWD/vulkan" >> "$GITHUB_PATH"
      # A crash leaves a core, whose stack names what no test's output can. On Ubuntu alone, the one
      # lane where the crash of the issue log shows. Ubuntu's apport takes a core by default, and a
      # step starts at core limit 0, so `BASH_ENV` raises it in each later step, as HAProxy's CI
      # keeps its cores:
      # https://git01.mediatek.com/plugins/gitiles/haproxy/+/6435801d09cac089e705baed57f839495f61a972%5E%21
      # The limit, 4 GiB in KiB, keeps a core from filling the disk the later steps build on. The
      # one crash here, of a plain binary as bash handles SIGSEGV itself, proves the route, so that
      # a later "no core" means no crash.
      - name: Keep the core of a crashed process
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w 'kernel.core_pattern=/tmp/core.%p.%E'
          echo 'ulimit -c 4194304' > "$RUNNER_TEMP/core-limit.sh"
          echo "BASH_ENV=$RUNNER_TEMP/core-limit.sh" >> "$GITHUB_ENV"
          (ulimit -c 4194304; sleep 60 & kill -SEGV $!; wait $!) || true
          compgen -G '/tmp/core.*' || echo '::warning::a crash left no core file'
          rm -f /tmp/core.*
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Only master writes, so a pull request cannot evict what others read.
          # No `key`: the action already keys on job, OS and architecture, and
          # nothing else tells the matrix entries apart.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # The gate of AGENTS.md, one step per command, each run past an earlier failure, so one run
      # reports every lane.
      - run: cargo fmt --all --check
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-lint
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-lint-nowinit
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-ship
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-ship-nowinit
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-test
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-test-nowinit
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-doc
        env:
          RUSTDOCFLAGS: -D warnings
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-doctest
      # After every gate step, so a crash in any of them reports. `%E` holds the binary's path, with
      # `!` for each `/`.
      - name: Print the stack of each crashed process
        if: ${{ failure() && runner.os == 'Linux' }}
        run: |
          shopt -s nullglob
          cores=(/tmp/core.*)
          echo "${#cores[@]} core(s) at core limit $(ulimit -c)"
          [ "${#cores[@]}" -gt 0 ] || exit 0
          sudo apt-get install -y --no-install-recommends gdb
          for core in "${cores[@]}"; do
            exe=$(basename "$core" | sed 's/^core\.[0-9]*\.//' | tr '!' '/')
            timeout 300 gdb --batch -ex 'thread apply all bt' "$exe" "$core" || true
          done

  api-surface:
    name: public API surface
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo install --locked --git https://github.com/xorza/drive
      # The committed surface must be what the tree renders: a change to the public API shows
      # here as a diff until `.notes/API_SURFACE.md` is regenerated with it.
      - run: cargo drive surface
      - run: git diff --exit-code -- .notes/API_SURFACE.md
