<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Aperture">
  <defs>
    <radialGradient id="mark-core" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#f1eaff"/>
      <stop offset="0.45" stop-color="#8b6bff"/>
      <stop offset="1" stop-color="#28c9c6"/>
    </radialGradient>
    <linearGradient id="mark-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe9db"/>
      <stop offset="1" stop-color="#9a86ff"/>
    </linearGradient>
    <!-- The lit limb is the disc minus a second disc offset up-right, so the
         phase is the offset rather than a hand-drawn outline. -->
    <mask id="mark-limb">
      <circle cx="64" cy="64" r="48" fill="#fff"/>
      <circle cx="86" cy="50" r="46" fill="#000"/>
    </mask>
  </defs>
  <circle cx="64" cy="64" r="48" fill="#171326"/>
  <circle cx="64" cy="64" r="48" fill="url(#mark-core)" mask="url(#mark-limb)"/>
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#mark-ink)" stroke-width="2.4"/>
</svg>
