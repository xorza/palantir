[package]
name = "palantir-showcase"
version = "1.0.0"
authors = ["xxorza <xxorza@gmail.com>"]
edition = "2024"
license = "(MIT OR Apache-2.0) AND OFL-1.1"
publish = false
repository = "https://github.com/xorza/palantir"
description = """
A tour of palantir's widgets, written against its public API, and the scene its
benches and integration tests run
"""

[lib]
bench = false

[[bin]]
bench = false
name = "palantir-showcase"
path = "src/main.rs"
test = false

[[test]]
name = "visual"
path = "tests/visual/main.rs"

[[test]]
name = "alloc"
path = "tests/alloc/main.rs"

[[bench]]
harness = false
name = "palantir"
required-features = ["internals"]

[dependencies]
bytemuck = { workspace = true }
palantir = { workspace = true, features = ["winit", "png"] }
tracing-subscriber = { workspace = true }

[dev-dependencies]
backtrace = { workspace = true }
half = { workspace = true }
palantir = { workspace = true, features = ["internals"] }
palantir-showcase = { workspace = true, features = ["internals"] }

[features]
internals = ["palantir/internals"]
profile-with-tracy = ["palantir/profile-with-tracy"]

[lints]
workspace = true
