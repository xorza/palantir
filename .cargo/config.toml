# x86-64-v3 makes F16C static, so the f16 conversions inline. An env `RUSTFLAGS` would replace this
# section, so CI sets none and builds this, as a local gate and Darkroom do.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]

[alias]
# The nowinit lanes leave the showcase out: it needs winit, which would turn the feature on for
# palantir too.
gate-lint = "clippy --workspace --all-targets --all-features --keep-going -- -D warnings"
gate-lint-nowinit = "clippy --workspace --exclude palantir-showcase --all-targets --no-default-features --keep-going -- -D warnings"
gate-ship = "clippy --workspace --release --keep-going -- -D warnings"
gate-ship-nowinit = "clippy --workspace --exclude palantir-showcase --release --no-default-features --keep-going -- -D warnings"
gate-test = "test --workspace --lib --test alloc --example reel --no-fail-fast --features golden,gpu-debug-markers"
gate-test-nowinit = "test --workspace --exclude palantir-showcase --lib --no-default-features --no-fail-fast"
# `-D warnings` through a `cfg(all())` entry, as an env `RUSTDOCFLAGS` would replace the one Darkroom's
# config holds for x86-64-v3. A build directory of its own, as cargo locks one for each command: the
# lane runs rustdoc on one core for most of a minute, beside the other lanes (AGENTS.md
# "Verification"), as rust-analyzer's `cargo.targetDir` keeps its check off the build's lock. A
# `--config` beats an env `CARGO_BUILD_BUILD_DIR`. Cost: its dependencies' metadata built again
# there.
gate-doc = 'doc --workspace --no-deps --document-private-items --all-features --keep-going --config target."cfg(all())".rustdocflags=["-D","warnings"] --config build.build-dir="{workspace-root}/target/build-doc"'
gate-doctest = "test --workspace --doc --no-fail-fast --features golden,gpu-debug-markers"
visual = "test --workspace --features golden,gpu-debug-markers --test visual"
shot = "run -p palantir-showcase --features golden -- --shot"
reel = "run -p palantir-showcase --example reel --profile release-dev --"
# `--bench palantir` alone: `damage_sweep` times hundreds of arms, a study rather than a regression
# check. `--bench *`, not `--benches`, which also selects the library.
bench-all = "bench --workspace --bench palantir"
bench-once = "test --workspace --bench *"
damage-sweep = "bench -p palantir-showcase --bench damage_sweep"
