# x86-64-v3 makes F16C static, so the f16 conversions inline. An env `RUSTFLAGS` replaces this
# section, so CI, which sets `-D warnings`, builds the baseline.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]

[alias]
gate-lint = "clippy --workspace --all-targets --all-features --keep-going -- -D warnings"
gate-lint-nowinit = "clippy --workspace --all-targets --no-default-features --keep-going -- -D warnings"
gate-ship = "clippy --workspace --release --keep-going -- -D warnings"
gate-ship-nowinit = "clippy --workspace --release --no-default-features --keep-going -- -D warnings"
gate-test = "test --workspace --lib --test alloc --example showcase --example reel --no-fail-fast --features golden,gpu-debug-markers"
gate-test-nowinit = "test --workspace --lib --no-default-features --no-fail-fast"
gate-doc = "doc --workspace --no-deps --document-private-items --all-features"
gate-doctest = "test --workspace --doc --no-fail-fast --features golden,gpu-debug-markers"
visual = "test --workspace --features golden,gpu-debug-markers --test visual"
shot = "run --example showcase --features golden -- --shot"
reel = "run --example reel --profile release-dev --"
# `--bench *`, not `--benches`, which also selects the library.
bench-all = "bench --workspace --bench *"
bench-once = "test --workspace --bench *"
