# wgpu belongs to `crate::gpu`, and nothing else may name one of its types.
#
# The module opts out with a single `#![allow(clippy::disallowed_types)]` at
# the top of `src/gpu/mod.rs`, which covers every file under it. Everywhere
# else a device, a texture or a format travels as one of Palantir's own
# handles — `Gpu`, `RenderTarget`, `TargetFormat` — so the host, the window
# driver and the widgets name no graphics-API type at all.
#
# There is no wildcard: `wgpu::*` and a bare `wgpu` are both rejected with
# "does not refer to a reachable type", because clippy resolves each entry to
# one `DefId` by exact lookup. So the list is generated from the tree:
#
#     grep -rhoE 'wgpu::[A-Za-z_][A-Za-z0-9_]*' --include='*.rs' src/ | sort -u
#
# Regenerate it after a wgpu upgrade that introduces a type Palantir starts
# using. A type missing from the list is simply unguarded, not an error.
disallowed-types = [
    { path = "wgpu::Adapter", reason = "wgpu belongs to crate::gpu" },
    { path = "wgpu::AdapterInfo", reason = "wgpu belongs to crate::gpu" },
    { path = "wgpu::AddressMode", reason = "wgpu belongs to crate::gpu" },
    { path = "wgpu::BindGroup", reason = "wgpu belongs to crate::gpu" },
